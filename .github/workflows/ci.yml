name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: cli/api typecheck against the toolkit's emitted dist/
      # declarations, which must exist before `tsc --noEmit` runs there.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm -r run typecheck
